; ================================================================
; SIZE LIMITS – CONTROL DE TAMAÑO DE LOGS Y JSON
; Versión reforzada para producción MIIA
; Fecha: febrero 2026
; ================================================================

[size_limits]
; Tamaño máximo permitido por archivo individual (en MB)
max_log_size_mb     = 200
max_json_size_mb    = 200

; Habilitar limpieza automática cuando un archivo supera el límite
auto_cleanup        = true


; ================================================================
; REGLAS AVANZADAS – Qué hacer cuando se supera el límite
; ================================================================

[over_limit_rules]
; Acción a tomar cuando un archivo excede el tamaño máximo:
;   delete   → borrar el archivo por completo
;   rotate   → renombrar el archivo viejo y crear uno nuevo
;   compress → comprimir el archivo viejo (zip/gz)
;   trim     → recortar el archivo en caliente (mantener solo las últimas líneas)
over_limit_action   = rotate

; Cuántas versiones rotadas mantener (historial)
max_rotated_files   = 10

; Comprimir los archivos rotados para ahorrar espacio
compress_rotated    = true

; Validar integridad del archivo antes de cualquier operación
validate_file_integrity = true

; Archivos que NUNCA deben ser tocados por las reglas de limpieza
protected_files     = system.log,core.log,auditoria.log


; ================================================================
; MONITOREO Y ALERTAS
; ================================================================

[monitoring]
; Registrar en log cada vez que un archivo supera o se acerca al límite
log_overlimit_events = true

; Nivel de detalle para estos eventos
log_level           = INFO

; Archivo donde se guardan los eventos de tamaño
log_file            = operador/aprendizaje/logs/size_limits.log

; Porcentaje de uso en el que se activa alerta temprana (ej: 90%)
alert_threshold_percent = 90

; Habilitar alertas preventivas (antes de llegar al límite)
early_warning       = true


; ================================================================
; OPERACIONES DE LIMPIEZA AUTOMÁTICA
; ================================================================

[cleanup]
; Limpiar de forma más agresiva cuando el uso es crítico
aggressive_cleanup  = false

; Cada cuántos minutos revisar automáticamente el tamaño de archivos
scan_interval_minutes = 30

; Verificar permisos antes de intentar borrar/rotar/comprimir
check_permissions   = true


; ================================================================
; PROTECCIÓN CONTRA ERRORES Y FALLOS
; ================================================================

[error_handling]
; Continuar ejecución si falla la limpieza de UN archivo
skip_errors         = true

; Registrar en log cada vez que falla la limpieza de un archivo
log_file_errors     = true