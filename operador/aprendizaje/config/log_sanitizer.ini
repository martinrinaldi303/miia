; ================================
; LOG SANITIZER CONFIG
; Limpieza y rotación de logs.
; ================================

[general]
enabled = true
log_level = INFO
log_file = operador/aprendizaje/logs/log_sanitizer.log

[rotation]
; Tamaño máximo del archivo de log antes de rotar (MB)
max_log_size_mb = 20

; Número máximo de archivos de log rotados a conservar
max_rotated_files = 10

; Política de compresión para logs viejos: none | gzip | zip
compression = gzip

[dedup]
; Habilita detección de mensajes repetidos tipo spam
enabled = true

; Ventana de tiempo para contar duplicados (segundos)
window_seconds = 60

; Número máximo de repeticiones del mismo mensaje en la ventana
max_repeated_messages = 10

; Acción al superar el máximo: drop | collapse
; collapse = se guarda un solo log con contador
on_excess_repeats = collapse

[severity_filter]
; Severidad mínima a registrar: DEBUG | INFO | WARNING | ERROR | CRITICAL
min_severity = INFO

[startup_cleanup]
; Eliminar logs muy viejos al arrancar
cleanup_on_start = true

; TTL por defecto para logs (segundos)
logs_default_ttl_seconds = 1209600     ; 14 días

; Directorio raíz de logs
logs_root_dir = operador/aprendizaje/logs
