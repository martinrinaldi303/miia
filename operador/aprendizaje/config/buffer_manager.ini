; ================================
; BUFFER MANAGER CONFIG
; Controla el tamaño de los JSON del "cerebro".
; ================================

[general]
enabled = true

; Límite máximo de líneas / entradas por archivo JSON
max_lines_per_file = 5000

; Política de recorte: fifo | lru | none
; fifo = lo más viejo se elimina primero
policy = fifo

; Si es true, nunca se bloquea la escritura: se recorta antes de insertar
trim_before_insert = true

; Nivel mínimo de log
log_level = INFO
log_file = operador/aprendizaje/logs/buffer_manager.log

[backup]
; Habilita backups comprimidos periódicos
enabled = true

; Intervalo entre backups (en minutos)
backup_interval_minutes = 120

; Directorio destino para backups
backup_dir = operador/aprendizaje/backups/buffer

; Formato: zip | tar.gz
backup_format = zip

; Número máximo de backups a conservar (rotación)
max_backup_files = 10

[limits]
; Tamaño máximo de archivo en MB antes de forzar recorte duro
max_file_size_mb = 50

; Si se alcanza max_file_size_mb y no puede recortar más: 
; action_on_overflow = rotate | block | delete_oldest_file
action_on_overflow = rotate

; Directorio raíz del cerebro JSON
brain_root_dir = operador/aprendizaje/json_guardados
