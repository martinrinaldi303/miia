; ================================
; STREAM THROTTLE CONFIG
; Control de velocidad hacia Redis y la UI.
; ================================

[general]
enabled = true
log_level = INFO
log_file = operador/aprendizaje/logs/stream_throttle.log

[redis]
; Máximo de mensajes por segundo hacia Redis (global)
max_msgs_per_second = 200

; Manejo al exceder: drop | queue | block
on_overload_action = queue

; Tamaño máximo de cola de espera (mensajes)
max_queue_size = 5000

[ui]
; Máximo de mensajes por segundo hacia la UI
max_msgs_per_second = 20

; Si true, los mensajes no críticos pueden ser descartados en congestión
drop_non_critical = true

; Campo que indica severidad o criticidad
severity_field_name = severidad
; Valores considerados críticos (separados por coma)
critical_severity_values = error,critical,alert

[slow_mode]
; Habilita modo lento si se detecta congestión sostenida
enabled = true

; Umbral de uso (0-100%) para activar modo lento
usage_threshold_percent = 80

; Factor de reducción en modo lento (0-100%)
slowdown_percent = 50

; Tiempo mínimo en modo lento antes de intentar volver a normal (segundos)
min_slow_mode_seconds = 60
