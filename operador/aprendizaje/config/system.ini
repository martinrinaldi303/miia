; ================================================================
; SYSTEM - Configuración general del sistema MIIA
; ================================================================

[general]
; Entorno de ejecución (development / production / testing)
env = development

; Nivel de logging global (DEBUG, INFO, WARN, ERROR)
log_level = INFO

; Habilitar modo debug (más logs, más verbose)
debug = true

; Habilitar o deshabilitar el watcher de cambios en configs
enable_config_watcher = true

; Intervalo de chequeo de salud del sistema (segundos)
health_check_interval_sec = 60

; Activar modo de emergencia si se detecta sobrecarga
emergency_mode_enabled = true
emergency_threshold_percent = 90

; Máximo tiempo de ejecución de un ciclo cognitivo (ms)
max_cycle_time_ms = 30000

[performance]
; Habilitar optimizaciones agresivas (reduce logs, reduce chequeos)
performance_mode = false

; Límite de memoria aproximado para alertar (MB)
memory_alert_mb = 400