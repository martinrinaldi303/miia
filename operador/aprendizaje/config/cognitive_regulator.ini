[cognitive]
enabled = true

; passive | balanced | intensive
mode = balanced

; mínimo tiempo entre pensamientos
min_interval_ms = 1500

; límites por ventana de 60s
max_thoughts_per_min = 40
max_publish_per_min = 25

; 0 = silencioso | 1 = verboso
verbosity = 0.6

; agrega pensamientos similares
aggregation = true

; protección dura
hard_stop_on_loop = true
loop_threshold = 6

; modo al degradar
fallback_mode = passive
; === ANTI-LOOP FUERTE ===
max_thoughts_per_min = 12          ; antes estaba en 40-60 → baja mucho
min_interval_ms = 4500             ; mínimo 4.5 segundos entre pensamientos
hard_stop_on_loop = true
loop_threshold = 4                 ; si 4 reflexiones iguales → corte duro
fallback_mode = passive            ; cuando se activa el hard-stop pasa a modo pasivo
[regulator]
min_intervalo_ms = 800
max_pensamientos_por_min = 40
min_intervalo_decision_ms = 1200
loop_window_ms = 45000
max_consecutive_loops = 6