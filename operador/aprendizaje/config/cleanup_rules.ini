; ================================================================
; PROTECTED CLEANUP RULES
; Reglas de protección y exclusión para el limpiador del sistema.
; ================================================================

[protection]
; Días máximos permitidos antes de que un archivo sea elegible para limpieza
max_file_age_days = 10

; Extensiones que JAMÁS deben eliminarse
; Separadas por punto y coma
keep_extensions = .pdf

; Carpetas completamente protegidas (no se tocan bajo ninguna condición)
keep_folders = memoria;config

; Protección ampliada: evita entrar en subdirectorios críticos
protect_subfolders = true

; Evita borrar archivos que hayan sido modificados recientemente
recent_hard_protect_hours = 6

; Evitar tocar archivos con atributos de solo lectura del sistema
skip_readonly_files = true

; Evitar tocar archivos ocultos
skip_hidden_files = true


; ================================================================
; FALLBACKS Y MANEJO DE ERRORES
; ================================================================

[safety]
; Si ocurre error con un archivo, continuar sin detener la limpieza
continue_on_error = true

; Registrar errores individuales
log_errors = true

; Activar modo "estricto": 
; solo se borran archivos que cumplan TODAS las reglas sin excepción
strict_mode = true

; Límite máximo de archivos a eliminar en un solo ciclo
max_deletions_per_cycle = 200


; ================================================================
; LOGGING
; ================================================================

[logging]
log_level = INFO
log_file = operador/aprendizaje/logs/protected_cleanup.log

; Registrar cada archivo protegido cuando se salta
log_protection_hits = true

; Registrar cada archivo eliminado
log_clean_actions = true


; ================================================================
; PROGRAMACIÓN DEL MÓDULO
; ================================================================

[scheduler]
; Cada cuánto ejecutar limpieza (en minutos)
interval_minutes = 90

; Minimizar impacto de CPU
spread_cleanup = true
cpu_limit_percent = 25
