; ================================================================
; SECURITY CORE – CONFIGURACIÓN CENTRAL DE SEGURIDAD MIIA
; Nivel enterprise / producción
; ================================================================



; ================================================================
; =======================  CONFIG GENERAL  ========================
; ================================================================

[security]
enable = true
strict_mode = true

; Validación profunda de estructuras JSON y mensajes
validar_esquemas = true
sanear_textos = true
bloquear_payloads_invalidos = true

; Evitar usar módulos si tienen errores estructurales
fail_fast_on_validation_error = true

; Registrar todos los eventos de violación
log_security_violations = true

; Proteger contra ataques de saturación
anti_flood_protection = true



; ================================================================
; ==========================  LIMITES  ============================
; ================================================================

[security.limites]
max_payload_kb = 900
max_texto_usuario = 6000
max_eventos_por_segundo_modulo = 40
max_eventos_global_seg = 200
max_size_json_kb = 1200
drop_mensajes_sobrantes = true

; Limitar profundidad máxima de estructuras JSON
max_json_depth = 40

; Limitar número de claves por objeto JSON
max_json_keys = 200

; Cortar payloads extremadamente grandes
auto_truncate_payload = true



; ================================================================
; =====================  CANALES PROTEGIDOS  =====================
; ================================================================

[security.canales_protegidos]
list = class25_ingest,class25_output,class30_output,miia.input.text,python_feedback,ui_stream

; Enforzar uso exclusivo: otros canales requieren validación explícita
strict_protected_mode = true

; Evitar spoofing de canales
require_channel_prefix = miia.

; Log de accesos a canales protegidos
log_protected_channel_access = true



; ================================================================
; =====================  CONTROL DE ORIGENES  ====================
; ================================================================

[security.origen]
bloquear_origenes_desconocidos = true
exigir_tag_modulo = true

; Lista de módulos internos confiables
trusted_modules = class25,class30,class14,class7,class6,python_core,ui_stream

; Evitar que un módulo se haga pasar por otro
prevent_identity_spoofing = true



; ================================================================
; ========================  CHECKSUM  =============================
; ================================================================

[security.checksum]
enable = true
algorithm = sha256
drop_on_mismatch = true

; Recalcular checksum internamente antes de procesar
double_verify = true

; Registrar fallos de checksum
log_checksum_failures = true



; ================================================================
; ==================  VALIDACIÓN DE BUCLE / LOOP  =================
; ================================================================

[security.validacion_bucle]
block_self_messages = true
block_reflexive_responses = true
block_excessive_similarity = true
similarity_threshold = 0.92

; Tiempo mínimo entre mesajess del mismo módulo
min_interval_ms = 50

; Protección contra eco (mismo input → mismo output)
prevent_echo_response = true

; Registrar cada loop detectado
log_loop_events = true



; ================================================================
; =====================  FILTRADO DE ENTRADA  ====================
; ================================================================

[security.filtrado_entrada]
sanitize_regex = true

; Patrones a eliminar
regex_rules = <>,\\u0000,script,eval\(,DROP TABLE,DELETE FROM,INSERT INTO,system\(,-- 

replace_with = 

; Filtrar caracteres no imprimibles
block_control_characters = true

; Evitar HTML peligroso
strip_html_tags = true

; Normalizar Unicode
normalize_unicode = true

; Log de filtrado
log_sanitized_inputs = true



; ================================================================
; =====================  SEGURIDAD PYTHON CORE  ==================
; ================================================================

[security.seguridad_python]
max_mensajes_por_minuto = 30
bloquear_si_falla_checksum = true
msg_min_interval_ms = 250
require_context = true
require_user_id = true

; Evitar ejecución de código arbitrario
block_dynamic_eval = true

; Protección contra payloads Python no seguros
reject_python_objects = true

; Log de violaciones del núcleo Python
log_python_violations = true



; ================================================================
; =====================  PROTECCIÓN MEMORIA  =====================
; ================================================================

[security.proteccion_memoria]
max_heap_mb = 800
max_json_cache_items = 500
max_vector_buffer = 1000
evict_if_full = true

; Política de expulsión: fifo | lru | oldest_timestamp
eviction_policy = fifo

; Proteger memoria contra corrupción
validate_memory_entries = true

; Backup rápido antes de limpieza crítica
backup_before_eviction = true



; ================================================================
; =======================  PROTECCIÓN REDIS  =====================
; ================================================================

[security.proteccion_redis]
block_publish_if_overload = true
max_pending_messages = 50000
fallback_action = drop_and_log       ; drop_and_log | throttle | reroute

; Evitar flooding hacia Redis
max_publish_per_second = 120

; Limitar tamaño de mensajes publicados
max_publish_size_kb = 800

; Log de saturación
log_redis_overload = true



; ================================================================
; =======================  PROTECCIÓN LOGS  ======================
; ================================================================

[security.proteccion_log]
apply_logging_limits = true
max_logs_per_sec = 25
drop_excess_logs = true

; Evitar spam interno
dedupe_logs = true
dedupe_window_s = 20

; Limitar tamaño por línea
max_log_line_chars = 4000



; ================================================================
; ==========================  AUDITORIA  ==========================
; ================================================================

[security.auditoria]
enable = true
ruta = ./operador/aprendizaje/logs/auditoria
agrupar_por_modulo = true
registrar_drops = true
registrar_violaciones = true

; Máximo tamaño por archivo de auditoría (MB)
max_audit_file_mb = 40

; Compresión automática de auditorías antiguas
compress_old_audits = true

; Retención (días)
retencion_dias = 14

; Registrar intentos sospechosos
log_suspicious_events = true
