; ================================
; RATE LIMIT CONFIG
; Limita mensajes por tiempo para evitar saturación.
; ================================

[general]
enabled = true
log_level = INFO
log_file = operador/aprendizaje/logs/rate_limit.log

[channel_limits]
; Máximo de mensajes por segundo por canal (Redis / buses internos)
default_msgs_per_second = 50

; Canal específico (sobrescribe default). Formato: canal=valor
; Ejemplo: canal_chat = 20
; Puedes agregar más líneas tipo: canal_nombre = valor
canal_chat = 20
canal_logs = 100

[module_limits]
; Máximo de mensajes por minuto por módulo
default_msgs_per_minute = 600

; Ejemplo de overrides
class19 = 300
class25 = 300
class27 = 200

[penalty]
; Factor de penalización incremental (1.0 = sin penalización)
; Cada vez que se viola el límite, aumenta un poco el cooldown.
penalty_factor_step = 0.25
penalty_factor_max = 3.0

; Tiempo base de cooldown en segundos
base_cooldown_seconds = 5

[cooldown]
; Si es true, entra en modo cooldown automático al detectarse exceso
enabled = true

; Modo: soft = solo ralentiza, hard = bloquea temporariamente
mode = soft

; Porcentaje de reducción en soft mode (0-100)
soft_mode_reduction_percent = 70


; === THROTTLE ESPECÍFICO PARA INTROSPECCIÓN ===
[class27]
max_per_second = 2
max_per_minute = 20
penalty_ms = 8000                  ; penalización fuerte cuando se pasa

[class25.causal.learn]
max_per_second = 3 
