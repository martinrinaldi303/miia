; ================================================================
; SYSTEM LOGGING CONTROL
; Control avanzado de frecuencia y protección contra spam en logs.
; ================================================================

[logging]
; Intervalo mínimo permitido entre logs iguales (anti-spam)
; Si un mismo mensaje se repite antes de este tiempo, se descarta.
log_min_interval_sec = 120

; Máximo de logs permitidos por segundo (global)
max_logs_per_sec = 40

; Máximo de logs permitidos por minuto
max_logs_per_min = 2000

; Detección de spam por repetición
enable_repetition_filter = true
max_repeated_messages = 5
repetition_window_sec = 30

; Si un mensaje se repite demasiado rápido:
; drop = descartar
; collapse = guardar solo uno con contador
on_repetition = collapse



; ================================================================
; SEGURIDAD Y PROTECCIÓN
; ================================================================

[protection]
; No permitir que el sistema haga logs durante condiciones de CPU crítica
cpu_protection_enabled = true
cpu_max_percent = 75

; Proteger logs marcados como críticos
protect_critical_logs = true
critical_keywords = CRITICAL;FATAL;PANIC

; No registrar logs demasiado grandes
max_log_message_length = 5000



; ================================================================
; ROTACIÓN Y MANTENIMIENTO
; ================================================================

[rotation]
; Tamaño máximo de archivo antes de rotar (MB)
max_log_file_size_mb = 25

; Número máximo de archivos rotados a conservar
max_rotated_files = 12

; Compresión de logs viejos: none | gzip | zip
compression = gzip



; ================================================================
; RUTAS Y ARCHIVOS
; ================================================================

[paths]
; Carpeta donde se guardan los logs del sistema
log_root_dir = operador/aprendizaje/logs/system

; Archivo principal
main_log_file = operador/aprendizaje/logs/system/system_main.log

; Carpetas protegidas (no se borran)
protected_log_dirs = operador/aprendizaje/logs/critical;operador/aprendizaje/logs/core



; ================================================================
; MANEJO DE ERRORES
; ================================================================

[errors]
; Si ocurre un error en el sistema de logs, continuar sin bloquear
ignore_logging_errors = true

; Registrar fallas internas del módulo de logging
log_internal_errors = true
