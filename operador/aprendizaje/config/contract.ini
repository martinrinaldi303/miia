; ==========================================================
; MIIA — Contrato de Entrada class25
; Define el formato obligatorio para mensajes enviados
; al canal class25_ingest
; ==========================================================

[input_contract]

; ----------------------------------------------------------
; Activación general
; ----------------------------------------------------------
enabled = true
strict_mode = true          ; Si true → rechaza si falta campo obligatorio
log_rejections = true       ; Loggea motivo de rechazo
allow_unknown_fields = true ; Permite campos extra no definidos


; ----------------------------------------------------------
; Campos obligatorios
; ----------------------------------------------------------
required_fields = text,source

; Tipos esperados
type.text = string
type.source = string
type.user = string
type.type = string
type.sentiment = number
type.impact = number


; ----------------------------------------------------------
; Reglas sobre el texto
; ----------------------------------------------------------
min_text_length = 1
max_text_length = 5000
trim_text = true
allow_empty = false


; ----------------------------------------------------------
; Reglas sobre source
; ----------------------------------------------------------
min_source_length = 1
max_source_length = 100
forbidden_source_prefix = class25
allow_internal_sources = false


; ----------------------------------------------------------
; Anti-loop
; ----------------------------------------------------------
enable_anti_loop = true
anti_loop_ttl_ms = 15000
anti_loop_hash_fields = source,text


; ----------------------------------------------------------
; Filtro de contenido
; ----------------------------------------------------------
block_system_generated = false
block_ai_generated_prefixes = false

ai_generated_prefixes = Interpreto que,Analizo que,Razono que


; ----------------------------------------------------------
; Validación opcional avanzada
; ----------------------------------------------------------
validate_sentiment_range = true
sentiment_min = -1
sentiment_max = 1

validate_impact_range = true
impact_min = 0
impact_max = 1


; ----------------------------------------------------------
; Comportamiento en error
; ----------------------------------------------------------
on_validation_fail = reject      ; reject | warn | accept
emit_rejection_event = true
rejection_channel = system.log


; ----------------------------------------------------------
; Auditoría
; ----------------------------------------------------------
audit_valid_inputs = false
audit_invalid_inputs = true
