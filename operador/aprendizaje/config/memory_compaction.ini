; ================================
; MEMORY COMPACTION CONFIG
; Compactación de JSON del cerebro.
; ================================

[general]
enabled = true
log_level = INFO
log_file = operador/aprendizaje/logs/memory_compaction.log

; Intervalo de compactación automática (minutos)
compaction_interval_minutes = 10

[limits]
; Tamaño máximo de archivo JSON en MB
max_file_size_mb = 100

; Número máximo de entradas por archivo antes de compactar
max_entries_per_file = 10000

[compaction]
; Remover campos redundantes o poco útiles
remove_redundant_fields = true
; Lista de campos a eliminar (separados por coma)
fields_to_drop = raw_text_debug,stack_trace_detallado

; Merge de entradas similares
merge_similar_entries = true

; Umbral de similitud para merge (0.0 - 1.0)
merge_similarity_threshold = 0.90

; Acción al compactar: 
; compact_mode = in_place | rotate_new_file
compact_mode = rotate_new_file

; Directorio para archivos compactados (si rotate_new_file)
compact_output_dir = operador/aprendizaje/json_compactados

[safety]
; Copia de seguridad antes de compactar
backup_before_compact = true
backup_dir = operador/aprendizaje/backups/compaction
max_backup_files = 20
