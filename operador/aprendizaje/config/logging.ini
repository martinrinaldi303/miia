; ================================================================
; ADVANCED LOGGING SYSTEM
; Configuración completa, robusta y protegida del subsistema de logs
; ================================================================

[logging]
enabled = true
mode = rotating        ; rotating | static | hybrid

; Nivel por defecto del sistema
default_level = info

; Si true, valida que los niveles sean válidos antes de aplicar
strict_level_validation = true

; Evitar desbordes del sistema de logs
global_log_flood_protection = true
max_global_logs_per_sec = 200
max_global_logs_per_min = 6000



; ================================================================
; NIVELES POR MÓDULO
; ================================================================

[logging.levels]
class25 = debug
class30 = debug
class6 = warn
class7 = info
python = info



; ================================================================
; RUTAS Y DIRECTORIOS
; ================================================================

[logging.paths]
base = ./operador/aprendizaje/logs
errores = ./operador/aprendizaje/logs/errores
rotados = ./operador/aprendizaje/logs/rotados

; Crear carpetas automáticamente si no existen
auto_create_dirs = true

; Protección de rutas críticas
protected_dirs = ./operador/aprendizaje/logs/critical;./operador/aprendizaje/logs/core



; ================================================================
; ROTACIÓN DE LOGS
; ================================================================

[logging.rotation]
max_file_mb = 15
max_files = 5
max_total_mb = 150

; Intervalo para cortar logs automáticamente
; Ejemplos válidos: 1h, 30m, 24h
split_interval = 1h

compress_old = true     ; gzip automático
delete_after_days = 7

; Evitar compresión mientras otro proceso escribe
safe_compression = true



; ================================================================
; LIMITES Y CONTROL DE FLUJO
; ================================================================

[logging.limits]
max_line_size_kb = 40
max_writes_per_second = 30

; Si el buffer interno está lleno:
block_if_full = false
drop_if_overflow = true

; Si true, evita que logs enormes bloqueen el sistema
truncate_long_lines = true
max_line_length_chars = 20000



; ================================================================
; SEGURIDAD DE ESCRITURA
; ================================================================

[logging.security]
prevent_parallel_writes = true
use_queue_for_write = true
max_queue_size = 5000

; Si la cola llega al 80%, activar modo lento
slowdown_threshold_percent = 80
slowdown_factor = 0.6        ; reduce velocidad en 40%

; Protección contra deadlocks del sistema de logs
deadlock_timeout_sec = 5
auto_recover_from_deadlock = true



; ================================================================
; FORMATOS Y ESTILO DEL LOG
; ================================================================

[logging.format]
timestamp = iso       ; iso | epoch | utc
json_output = true
color_console = true

; Campos permitidos en salida JSON
fields = ts,tipo,msg,meta

; Validación estricta de campos
validate_fields = true



; ================================================================
; CONFIGURACIÓN POR MÓDULOS
; ================================================================

[logging.module.class6]
max_file_mb = 10
max_writes_per_second = 10
drop_if_overflow = true

[logging.module.class25]
max_file_mb = 25
max_writes_per_second = 60
drop_if_overflow = false

[logging.module.class30]
max_file_mb = 15

[logging.module.python_core]
max_file_mb = 20



; ================================================================
; FALLBACK SYSTEM
; ================================================================

[logging.fallback]
on_error = console        ; console | file | silent
path = ./operador/aprendizaje/logs/fallback
max_files = 10

; Si true, genera logs de emergencia cuando el sistema falla
enable_emergency_logger = true

; Limita tamaño de un archivo fallback
fallback_max_file_mb = 10



; ================================================================
; VALIDACIÓN INTERNA Y CONTROL DEL SISTEMA
; ================================================================

[logging.validation]
; Verifica permisos de escritura antes de operar
check_write_permissions = true

; Verificar espacio en disco mínimo (MB)
min_free_disk_mb = 300

; Acciones si el disco está lleno:
; drop | block | switch_to_fallback
on_disk_full = switch_to_fallback

; Evita que logs corrompidos se procesen
skip_corrupted_lines = true
