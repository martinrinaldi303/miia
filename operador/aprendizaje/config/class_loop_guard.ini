; ================================
; LOOP GUARD CONFIG
; Evita reprocesar exactamente el mismo mensaje.
; ================================

[general]
enabled = true
; Algoritmo de hash usado para detectar duplicados: md5 | sha1 | sha256
hash_algorithm = sha256

; Cantidad máxima de hashes a mantener en memoria por clase/módulo
max_hash_history = 5000

; Tiempo de vida de cada hash (segundos)
hash_ttl_seconds = 3600

; Si se detecta un loop: drop | log_only | raise
on_repeat_action = drop

; Nivel mínimo de log: DEBUG | INFO | WARNING | ERROR
log_level = INFO

; Archivo de log específico para este guard (si se deja vacío, usa el global)
log_file = operador/aprendizaje/logs/class_loop_guard.log

[origin_rules]
; Si es true, solo se considera duplicado si origen y hash coinciden
require_same_origin = true

; Lista de orígenes que se ignoran del loop guard (separados por coma)
; Ejemplo: origin_exempt = monitor_sistema,debug_tool
origin_exempt = 

[storage_backend]
; backend: memory | redis | file
backend = redis

; Solo si backend=redis
redis_url = redis://localhost:6379
redis_prefix = loopguard:

; Solo si backend=file
file_path = operador/aprendizaje/cache/loop_guard_hashes.db
file_sync_interval_seconds = 30
; === PROTECCIÓN ESPECÍFICA PARA CLASS27 ===
loop_guard_enabled = true
hash_ttl_seconds = 25              ; antes 10-15 → más memoria pero menos falsos positivos
max_repeated = 3                   ; si 3 veces la misma reflexión → drop total
action_on_loop = drop_and_notify   ; importante: que avise
protected_channels = class27_output,class27_reflection