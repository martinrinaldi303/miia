; ================================================================
; TERMINAL DEBUG CONFIG – CONTROL DE SALIDA EN CONSOLA
; Modo seguro, anti-spam y configurable para MIIA
; ================================================================

[terminal]
; Mostrar razonamientos internos (útil solo en modo desarrollo)
show_reasoned = true

; Mostrar procesos ya procesados con éxito
show_processed = true

; Mostrar errores en consola
show_errors = true

; Nivel de detalle:
; 0 = off
; 1 = básico
; 2 = detallado
verbosity = 1

; Tiempo mínimo entre mensajes (en segundos)
terminal_min_interval = 5


; ================================================================
; ======================= CONTROLES ANTI-SPAM ====================
; ================================================================

; Evitar saturar la terminal con mensajes repetidos
enable_deduplication = true

; Ventana temporal para agrupar mensajes duplicados (s)
dedupe_window_seconds = 10

; Número máximo de mensajes repetidos permitidos
max_repetitions = 3

; Acción en caso de spam:
; drop = descarta
; collapse = combina repeticiones
; throttle = ralentiza
on_spam_action = collapse

; Ralentizar la salida si hay exceso de logs
auto_throttle = true
throttle_factor = 0.6       ; reduce velocidad 40%


; ================================================================
; ======================= SEGURIDAD DE CONSOLA ====================
; ================================================================

; Evitar mostrar datos sensibles en pantalla
mask_sensitive_data = true

; Palabras clave que serán ocultadas automáticamente
sensitive_keywords = password,token,secret,apikey,credential

; Normalizar caracteres peligrosos
sanitize_output = true

; Bloquear salida de dumps JSON extremadamente grandes
max_output_length_chars = 8000
truncate_oversized_output = true


; ================================================================
; ====================== FILTROS ADICIONALES =====================
; ================================================================

; Permitir mostrar solo ciertos tipos de mensajes
enable_type_filters = true
allowed_types = info,error,debug,warning,success

; Ignorar categorías ruidosas
blocked_categories = internal_loop,heartbeat,polling


; ================================================================
; =================== RENDIMIENTO Y ESTABILIDAD ===================
; ================================================================

; Evitar que la terminal impacte el rendimiento
async_terminal_output = true

; Máximo de mensajes por segundo hacia terminal
max_msgs_per_second = 20

; Evitar saturación por múltiples hilos
prevent_parallel_output = true

; Registrar los mensajes descartados
log_dropped_to_terminal = false


; ================================================================
; ======================= LOGGING DEL SISTEMA =====================
; ================================================================

[terminal_logging]
log_level = INFO
log_file = operador/aprendizaje/logs/terminal_debug.log

; Registrar eventos inusuales
log_terminal_spikes = true
log_filtered_messages = false
