; ================================================================
; CONFIGURACIÓN GLOBAL DE MIIA - Límites y comportamiento general
; Versión reforzada - febrero 2026
; ================================================================

[global]
; Límite de eventos procesados por segundo (protección contra floods)
max_events_per_sec = 30

; Tamaño máximo de archivos JSON individuales (KB)
max_json_size_kb = 900

; Dimensión máxima permitida para vectores de embedding
max_vector_size = 4096

; Límite de memoria total aproximada para el proceso (MB)
max_memory_mb = 512

; Máximo de archivos abiertos simultáneamente
max_open_files = 256

; Intervalo mínimo entre operaciones intensivas (ms)
throttle_interval_ms = 150

; Habilitar throttling automático cuando se detecta presión
auto_throttle = true

; Umbral % de recursos para emitir advertencia temprana
resource_warning_threshold = 80

; Umbral % para activar modo de emergencia (hard limit)
resource_hard_limit_threshold = 95

; Acción al alcanzar el hard limit: cooldown, drop, reject, etc.
on_limit_reached = cooldown

; Duración del cooldown automático (ms)
cooldown_ms = 500


; ================================================================
; CLASS 1 - Búsquedas y fuentes externas
; ================================================================

[class1]
; Máximo de noticias/artículos a procesar por ciclo
max_news_items = 200

; Máximo de requests salientes por minuto (evitar ban APIs)
max_request_per_min = 40

; Tiempo de espera entre requests fallidos (backoff)
request_backoff_ms = 120

; Habilitar caché local de resultados de búsqueda
enable_cache = true

; Tiempo de vida del caché de búsquedas (minutos)
max_cache_minutes = 10


; ================================================================
; CLASS 2 - Procesamiento de PDFs y documentos
; ================================================================

[class2]
; Máximo de páginas a procesar por PDF
max_pdf_pages = 80

; Máximo de PDFs en cola simultánea
max_pdf_queue = 10

; Tamaño máximo de batch para generación de embeddings
max_embeddings_batch = 5

; Validar estructura y contenido del PDF antes de procesar
validate_pdf = true

; Tamaño máximo permitido por PDF (MB)
max_pdf_size_mb = 25

; Timeout para renderizado/extracción de PDF (segundos)
pdf_render_timeout_sec = 20


; ================================================================
; CLASS 5 - Procesamiento de texto largo
; ================================================================

[class5]
; Longitud máxima de texto a procesar en una pasada (caracteres)
max_text_length = 250000

; Límite de tokens aproximado por chunk
max_tokens = 4096

; Recortar automáticamente texto que exceda el límite
trim_oversize_text = true

; Máximo de oraciones permitidas en un chunk
max_sentences = 1500

; Resumir automáticamente cuando hay overflow
auto_summarize_on_overflow = true


; ================================================================
; CLASS 6 - Predicciones / Inferencias
; ================================================================

[class6]
; Máximo de predicciones por segundo
max_predictions_per_sec = 5

; Tamaño máximo de la cola de predicciones
max_queue = 25

; Habilitar modo seguro (más lento pero estable)
safe_mode = true

; Timeout máximo por predicción (ms)
prediction_timeout_ms = 180

; Estrategia de cola cuando está llena
queue_strategy = drop_oldest


; ================================================================
; CLASS 7 - Eventos de mercado / tiempo real
; ================================================================

[class7]
; Máximo de vectores a procesar en una pasada
max_vectors_process = 500

; Máximo de eventos de mercado por segundo
max_market_events_sec = 20

; Edad máxima de un evento antes de descartarlo (segundos)
max_event_age_sec = 15

; Descartar automáticamente eventos muy viejos
auto_discard_stale_events = true


; ================================================================
; CLASS 11 - Impactos / Ponderación
; ================================================================

[class11]
; Tamaño máximo de batch de impactos
max_impacts_batch = 15

; Retardo mínimo entre operaciones (ms)
min_delay_ms = 120

; Forzar procesamiento secuencial (más seguro)
force_sequential = true

; Timeout para batches (ms)
batch_timeout_ms = 300


; ================================================================
; CLASS 13 - Clustering / K-means
; ================================================================

[class13]
; Máximo de vectores para K-means
max_kmeans_vectors = 800

; Máximo de reintentos si falla K-means
max_kmeans_retry = 2

; Umbral Z-score para detectar outliers
z_score_threshold = 4

; Normalizar vectores antes de clusterizar
normalize_before_cluster = true

; Tiempo máximo permitido para clustering (segundos)
max_cluster_time_sec = 25


; ================================================================
; CLASS 17 - Gestión de usuarios / portafolios
; ================================================================

[class17]
; Máximo de usuarios simultáneos en memoria
max_users = 150

; Máximo de items en un portafolio
max_portfolio_items = 10

; Validar estructura de datos de usuario antes de procesar
validate_user_structure = true

; Máximo de items de riesgo a analizar
max_risk_items = 50


; ================================================================
; CLASS 19 - Caché general
; ================================================================

[class19]
; Máximo de items en caché
max_cache_items = 500

; Tiempo de expiración de caché (minutos)
expire_minutes = 90

; Política de desalojo
cache_eviction_policy = lru

; Tamaño máximo aproximado de caché (MB)
max_cache_mb = 60

; Recargar caché automáticamente al expirar
reload_on_expire = false


; ================================================================
; CLASS 25 - Núcleo cognitivo principal
; ================================================================

[class25]
; Máximo de eventos en memoria de corto plazo
max_memory_events = 400

; Longitud máxima permitida de un razonamiento (caracteres)
max_reasoning_length = 5800

; Máximo de inputs procesados por minuto
max_inputs_per_min = 20

; Retardo mínimo entre procesamientos (ms)
throttle_ms = 120

; Límite seguro de cadena de pensamiento
safe_chain_limit = 9

; Truncar automáticamente razonamientos demasiado largos
auto_truncate_reasoning = true

; Contexto máximo permitido (caracteres)
max_context_chars = 200000

; Rechazar procesamiento si hay overflow de contexto
reject_if_overflow = true


; ================================================================
; CLASS 30 - WebSocket / Salida en tiempo real
; ================================================================

[class30]
; Máximo de clientes WebSocket simultáneos
max_ws_clients = 20

; Máximo de eventos forwardeados por segundo
max_events_forward_sec = 20

; Intervalo de buffer/flush (ms)
buffer_interval_ms = 90000

; Descartar eventos si el buffer está sobrecargado
drop_if_overloaded = true

; Tamaño máximo de la cola de forwarding
max_forward_queue = 2500

; Intervalo mínimo entre flushes (ms)
min_flush_interval_ms = 400