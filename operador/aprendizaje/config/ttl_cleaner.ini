; ================================
; TTL CLEANER CONFIG
; Limpieza automática por tiempo de vida.
; ================================

[general]
enabled = true
log_level = INFO
log_file = operador/aprendizaje/logs/ttl_cleaner.log

; Ejecutar limpieza al inicio del núcleo Python
cleanup_on_start = true

; Ejecutar limpieza periódica
cleanup_interval_seconds = 300

[data_ttl]
; TTL en segundos por tipo de dato
; Ejemplos: razonamientos, contexto, memoria_largo_plazo, etc.
razonamientos_seconds = 7200       ; 2 horas
contexto_dialogo_seconds = 10800   ; 3 horas
memoria_corto_plazo_seconds = 14400
memoria_largo_plazo_seconds = 2592000  ; 30 días

[logs_ttl]
; TTL de logs en segundos
logs_default_seconds = 604800      ; 7 días
logs_errores_criticos_seconds = 2592000

[paths]
brain_root_dir = operador/aprendizaje/json_guardados
logs_root_dir = operador/aprendizaje/logs

; Qué hacer si alguna ruta no existe: ignore | create | error
on_missing_path = create
