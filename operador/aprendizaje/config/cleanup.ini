; ================================================================
; CLEANUP MANAGER CONFIG
; Control de limpieza automática de archivos y logs.
; ================================================================

[cleanup]
; Activa o desactiva el módulo
enabled = true

; Eliminación basada en antigüedad
; Número máximo de días que un archivo puede permanecer antes de ser eliminado
max_age_days = 3

; Límite máximo de archivos por carpeta antes de activar limpieza
max_files = 50

; Ejecutar limpieza inmediatamente al inicio del núcleo
delete_on_start = true

; Carpetas objetivo para aplicar limpieza (separadas por punto y coma)
paths = logs;operador/aprendizaje/logs;MIIA/logs

; Extensiones elegibles para eliminación (separadas por punto y coma)
extensions = .log;.txt;.json

; ================================================================
; REGLAS AVANZADAS
; ================================================================

[rules]
; Si es true, ignora archivos que fueron modificados manualmente en las últimas horas
protect_recent_hours = 2

; Si es true, solo eliminar si supera max_files o max_age_days
use_safe_mode = true

; Qué hacer con las carpetas vacías después de limpiar:
; keep | delete
empty_folder_behavior = keep

; Si se produce un error de lectura, continuar sin detener el sistema
skip_errors = true

; Proteger archivos marcados como críticos
protect_filenames = error.log;critical_event.json

; Evitar borrar archivos que contengan estas palabras clave
protect_keywords = important;keep;safe



; ================================================================
; LOGGING
; ================================================================

[logging]
; Nivel de log: DEBUG | INFO | WARNING | ERROR
log_level = INFO

; Archivo de log específico para este módulo
log_file = operador/aprendizaje/logs/cleanup_manager.log

; Registrar cuántos archivos fueron eliminados en cada ciclo
log_deletions = true

; Registrar errores individuales por archivo problemático
log_file_errors = true



; ================================================================
; PROGRAMACIÓN
; ================================================================

[scheduler]
; Intervalo de ejecución automática (en minutos)
interval_minutes = 60

; Si true, intenta distribuir la carga de limpieza para no impactar el CPU
spread_cleanup = true

; Máximo porcentaje de CPU permitido durante la limpieza
cpu_limit_percent = 30
