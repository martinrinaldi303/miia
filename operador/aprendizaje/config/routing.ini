; ================================================================
; ROUTING ENGINE – CONFIGURACIÓN AVANZADA
; Sistema de enrutamiento seguro entre módulos del núcleo MIIA
; ================================================================



; ================================================================
; =====================  CONFIGURACIÓN BASE  =====================
; ================================================================

[routing]
enable_strict_mode = true       ; Bloquea todo lo que no cumpla reglas
default_action = deny           ; deny | allow | audit-only

; Evita rutas ambiguas o no definidas
require_explicit_rule = true

; Activa protección contra rutas no declaradas
reject_unknown_origin = true

; Evita spoofing de módulos
require_module_tag = true

; Registrar decisiones del router
log_routing_decisions = true
log_violations = true

; Protección contra loops globales
detect_self_route = true
prevent_recursive_routes = true



; ================================================================
; ======================  PRIORIDADES  ============================
; ================================================================

[routing.prioridades]
class25 = 1
class30 = 2
class14 = 3
class7 = 4
class6 = 5
class5 = 6
class2 = 7
class1 = 8
python_core = 9
ui_stream = 10



; ================================================================
; ====================  CANALES PERMITIDOS  ======================
; ================================================================

[routing.canales_permitidos]
list = class25_ingest,class25_output,class14_output,class7_output,class6_output,class30_output,ui_stream,miia.input.text,python_feedback

; Validación estricta
strict_channel_validation = true


; ================================================================
; ====================  CANALES BLOQUEADOS  ======================
; ================================================================

[routing.canales_bloqueados]
list = class25_loop_debug,class30_raw,internal_test,debug_dump,unsafe_channel

; Evitar que canales bloqueados pasen aunque estén en una regla
override_rules_on_blocked = true



; ================================================================
; =====================  REGLAS DE ENRUTADO  =====================
; ================================================================

; ------------------------------------------------
; FORMATO DE LAS REGLAS:
; rule_X.from
; rule_X.to
; rule_X.canales
; rule_X.allow
; rule_X.reason
; ------------------------------------------------

; ---- Regla 1 -----------------------------------
[rule.1]
from = class14
to = class25
canales = class25_ingest
allow = true

; ---- Regla 2 -----------------------------------
[rule.2]
from = class25
to = class14
canales = class14_output
allow = true

; ---- Regla 3 -----------------------------------
[rule.3]
from = class7
to = class25
canales = class25_ingest
allow = true

; ---- Regla 4 -----------------------------------
[rule.4]
from = class30
to = class25
canales = class25_ingest
allow = true

; ---- Regla 5 -----------------------------------
[rule.5]
from = class30
to = python_core
canales = miia.input.text
allow = true

; ---- Regla 6 -----------------------------------
[rule.6]
from = python_core
to = class30
canales = python_feedback
allow = true

; ---- Regla 7 -----------------------------------
[rule.7]
from = class25
to = class30
canales = ui_stream
allow = true


; ================================================================
; ====================  REGLAS DE BLOQUEO  =======================
; ================================================================

; ---- Prevención de loops internos ------------------------------
[rule.8]
from = class30
to = class30
allow = false
reason = Evitar loops internos

[rule.9]
from = class25
to = class25
allow = false
reason = Evitar loops cognitivos

[rule.10]
from = class14
to = class14
allow = false
reason = Evitar loops no deseados

; Rechazo genérico para self-routing no permitido
enforce_no_self_route = true



; ================================================================
; ====================  RESTRICCIONES GLOBALES  ==================
; ================================================================

[routing.restricciones]
max_mensajes_por_seg = 50
max_payload_kb = 900

; Acción si una ruta no coincide con ninguna regla
drop_si_no_match = true

; Anti flood automático
auto_throttle = true
throttle_ms = 80

; Anti spam
min_interval_same_route_ms = 20

; Evita tormentas de mensajes entre dos módulos
link_flood_protection = true
max_link_messages_per_sec = 25



; ================================================================
; ==========================  FALLBACK  ===========================
; ================================================================

[routing.fallback]
accion = log_and_drop         ; log_and_drop | redirect | silent_drop
enviar_a = class30            ; Destino alternativo si redirect
message = RoutingReject: Mensaje no autorizado

; Registrar qué mensajes fueron enviados al fallback
log_fallback_events = true

; Protección: evitar que fallback genere loops
fallback_self_protection = true
