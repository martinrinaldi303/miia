; ================================================================
; MEMORY SYSTEM GUARD
; Limpieza, control, protección y prevención de loops internos.
; ================================================================



; ================================================================
; =========================  MEMORIA  ============================
; ================================================================

[memoria]
enabled = true

; Limpia automáticamente la memoria al iniciar el núcleo
clean_on_start = true

; Frecuencia de limpieza (segundos)
clean_interval_s = 600

; Archivos JSON con más de X días serán eliminados
max_age_days = 2

; Evitar duplicados semánticos o exactos en memoria JSON
prevent_duplicates = true

; Guardar huellas (hashes) para detectar duplicados
hash_memory = true
hash_algorithm = sha256

; Número máximo de archivos JSON permitidos en memoria
max_json_files = 300

; Directorios donde reside la memoria
memory_paths = operador/aprendizaje/memoria

; Protección adicional
safe_write_mode = true
validate_json_structure = true

; Si se detectan JSON corruptos
auto_fix_corrupt_json = true
backup_before_fix = true

; Máximo tamaño por archivo JSON (MB)
max_json_size_mb = 20



; ================================================================
; ==========================  LOGS  ===============================
; ================================================================

[logs]
enabled = true
clean_on_start = true

; Tiempo máximo permitido para un log (días)
max_age_days = 3

; Límite máximo de archivos en la carpeta
max_files = 200

; Rutas donde limpiar logs
paths = logs,operador/aprendizaje/logs

; Extensiones objetivo
extensions = .log,.txt

; Evitar borrar logs importantes
protect_keywords = critical,error,fatal

; Evitar borrar logs recientes
protect_recent_hours = 4

; Manejo de errores
skip_errors = true
log_errors = true

; Comportamiento al encontrar carpetas vacías
empty_folder_behavior = keep    ; keep | delete

; Rotación de logs (opcional)
enable_rotation = true
rotation_max_mb = 25
rotation_max_files = 10

; Comprimir logs viejos
compress_old_logs = true



; ================================================================
; ========================  ANTI-LOOP  ===========================
; ================================================================

[anti_loop]
enabled = true

; Cache de huellas para detectar loops (entradas y salidas)
cache_size = 5000

; Rechazar entradas repetidas exactas
reject_repeated_inputs = true

; Rechazar salidas generadas previamente
reject_repeated_outputs = true

; Hash usado para detectar duplicados
hash_algorithm = md5

; Tiempo de vida del hash (segundos)
hash_ttl_s = 3600

; Evitar loops por texto similar (protección extra)
semantic_loop_protection = true
semantic_threshold = 0.85

; Proteger contra loops rápidos (< X ms)
min_interval_ms = 50

; Log de loops
log_loop_events = true



; ================================================================
; =========================  GEMINI  =============================
; ================================================================
; Motor lingüístico MIIA — clase 25B
; Obtener key en: https://aistudio.google.com/
; Las keys válidas empiezan con "AIza..."
; Sin key → fallback interno (respuestas basadas en plantillas)

[gemini]
; api_key movida a config/.env (GEMINI_API_KEY) — class25B la lee de ahí
api_key =
model    = gemini-2.5-flash
max_tokens = 800

; ================================================================
; =========================  SISTEMA  ============================
; ================================================================

[sistema]
strict_mode = true
debug_output = false

; Limitar CPU para tareas de mantenimiento
maintenance_cpu_limit_percent = 30

; Validar rutas antes de iniciar
validate_paths_on_start = true

; Verificar espacio en disco mínimo (MB)
min_required_disk_mb = 300

; Acción si el disco está lleno:
; drop | pause | purge_old | abort
on_disk_full = purge_old

; Registro de errores del sistema
log_system_errors = true

; Prevención de deadlocks
deadlock_timeout_s = 5
auto_recover_deadlocks = true

; Protección contra archivos con permisos corruptos
skip_protected_files = true
