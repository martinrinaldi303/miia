; ================================
; SEMANTIC DEDUP CONFIG
; Evita duplicar razonamientos semánticamente similares.
; ================================

[general]
enabled = true
log_level = INFO
log_file = operador/aprendizaje/logs/semantic_dedup.log

[engine]
; Tipo de motor semántico: embeddings | llm | hybrid
engine_type = embeddings

; Dimensión del vector de embeddings (informativo para validación)
embedding_dim = 1536

; Umbral de similitud coseno para considerar duplicado (0-1)
similarity_threshold = 0.85

; Máximo de vectores a mantener en memoria por contexto
max_entries_per_context = 2000

[rules]
; Si hay duplicado: keep_latest | keep_oldest
on_duplicate = keep_latest

; Campo de texto sobre el que se calcula la similitud
text_field_name = contenido

; Campo de contexto/tema para agrupar razonamientos
context_field_name = contexto

; TTL para entradas del índice semántico (segundos)
index_ttl_seconds = 86400

[backend]
backend = redis
redis_url = redis://localhost:6379
redis_prefix = semanticdedup:
