; =============================================================================
; Configuración de MIIA - class25 y sistema general
; Formato INI - Generado a partir del JSON original
; Fecha: febrero 2026
; =============================================================================

[json_storage]
enabled = true
max_json_file_size_mb = 5
max_json_folder_size_mb = 250
rotation_strategy = size
compress_old_json = true
compression_format = zip
max_rotation_files = 50
delete_older_than_days = 30

[logs]
enabled = true
max_log_size_mb = 4
max_total_logs_mb = 350
rotation_interval_hours = 12
compress_old_logs = true
delete_old_logs_after_days = 20
fsync_every_write = false

[memory_cache]
enabled = true
max_items = 5000
max_item_size_kb = 300
ttl_minutes = 60
cleanup_interval_seconds = 90

[redis]
max_memory_mb = 300
eviction_policy = allkeys-lru
persist = false
snapshot_interval_minutes = 0
key_ttl_seconds = 1800

[vector_storage]
enabled = true
max_vectors_per_class = 10000
embedding_dim_limit = 4096
save_vectors_json = true
compress_old_vectors = true
delete_vectors_older_days = 45

[pdf_processing]
save_extracted_text = true
max_saved_text_mb = 150
compress_extracted_text = true
delete_text_older_days = 40

[backup]
enabled = true
backup_every_hours = 12
keep_last_backups = 10
backup_format = zip
backup_target = backups/