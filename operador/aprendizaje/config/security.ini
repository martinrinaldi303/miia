; ================================================================
; SECURITY GUARD – CONFIGURACIÓN GLOBAL DE SEGURIDAD MIIA
; ================================================================


; ================================================================
; =====================  INPUT SECURITY  ==========================
; ================================================================

[input_security]
max_text_length = 5000
max_pdf_size_mb = 30
max_docx_size_mb = 40
max_json_payload_kb = 900
max_user_requests_per_min = 30

block_empty_inputs = true
sanitize_input = true
strip_html = true
allow_external_urls = false
tokenize_before_process = true

; Rechazar inputs con solo espacios o caracteres de control
reject_whitespace_only = true

; Limitar longitud de URLs si se habilitan
max_url_length = 2000

; Lista de patrones peligrosos a filtrar (SQL/JS básico)
enable_basic_injection_filter = true
block_patterns = SELECT ,DROP TABLE,INSERT INTO,<script>,</script>,onerror=,onload=

; Log de inputs bloqueados
log_blocked_inputs = true



; ================================================================
; ===================  REASONING LIMITS  =========================
; ================================================================

[reasoning_limits]
max_reasoning_depth = 7
max_chain_steps = 9
max_tokens_per_step = 600

stop_on_loop_detect = true
detect_repeated_patterns = true
allow_recursive_reasoning = false

; Cortar razonamientos demasiado largos o divergentes
auto_truncate_reasoning = true
max_total_tokens_reasoning = 5000

; Protección contra oscilaciones (respuestas que van y vienen)
detect_back_and_forth_patterns = true

; Tiempo máximo por ciclo de razonamiento (ms)
max_step_time_ms = 800

; Acción al detectar loop: stop | log_only | escalate
on_loop_action = stop



; ================================================================
; ====================  FILE SECURITY  ===========================
; ================================================================

[file_security]
allow_file_read = false
allow_file_write = true

; Extensiones permitidas
allowed_extensions = json,log,txt

; Extensiones bloqueadas
blocked_extensions = exe,bat,cmd,dll,js,sh,msi

max_open_files = 200
sanitize_filenames = true
reject_double_path = true
reject_parent_path_escape = true

; Evitar rutas absolutas peligrosas
reject_absolute_root_paths = true

; Bloquear escritura fuera del sandbox
enforce_sandbox = true
sandbox_root = operador/aprendizaje

; Tamaño máximo por archivo (MB)
max_file_size_mb = 50

; Acción al violar reglas de archivos: block | log_only
on_file_violation = block



; ================================================================
; ====================  REDIS SECURITY  ==========================
; ================================================================

[redis_security]
max_events_per_sec = 30
max_publish_size_kb = 800
max_channels_subscribed = 50

require_origin_tag = true
reject_untrusted_channels = true

; Lista de canales permitidos
allowed_channels = class25_input,class25_output,class14_output,class7_output,ui_stream,miia.input.text

; Prohibir publicar en canales no declarados
strict_channel_enforce = true

; Prefijo requerido para canales internos seguros
required_channel_prefix = miia.

; Bloquear patrones peligrosos de canal
blocked_channel_patterns = debug,unsafe,raw

; Log de intentos de publicación no permitidos
log_unauthorized_redis_events = true



; ================================================================
; ====================  CONTEXT GUARD  ===========================
; ================================================================

[context_guard]
max_context_size_kb = 500
max_memory_items = 250
max_memory_item_length = 1200

purge_on_overflow = true
strip_sensitive_data = true
sanitize_history = true
throttle_user_memory_updates_ms = 400

; Definición básica de datos sensibles a intentar limpiar
sensitive_keywords = password,token,apikey,documento,tarjeta

; Política de purga: fifo | lru
purge_policy = fifo

; No guardar inputs marcados como privados
respect_user_private_flag = true

; Log cuando se purga contexto por overflow
log_purge_events = true



; ================================================================
; ==================  ENGINE PROTECTION  =========================
; ================================================================

[engine_protection]
enable_safe_mode = true
max_cpu_percent = 70
max_ram_mb = 700

kill_on_memory_leak = true
kill_on_file_spam = true
block_recursive_calls = true
allow_parallel_execution = false

; Umbral para detectar memory leak (MB/minuto)
memory_leak_threshold_mb_per_min = 80

; Máximo de archivos creados por minuto antes de considerarlo spam
max_files_per_min = 60

; Acción al activar protección: kill | throttle | isolate
on_protection_trigger = throttle

; Tiempo de enfriamiento después de un trigger (segundos)
cooldown_seconds = 30

; Log de eventos de protección
log_engine_protection_events = true



; ================================================================
; =================  ANOMALY DETECTION  ==========================
; ================================================================

[anomaly_detection]
enabled = true
max_events_burst = 100
max_vector_anomaly_score = 3.5
max_market_updates_per_10s = 30
block_if_anomaly_detected = true

; Ventana de tiempo para detectar bursts (ms)
burst_window_ms = 1000

; Acción al detectar anomalía: block | flag | throttle
on_anomaly_action = block

; Bloquear origen que generó la anomalía
block_offending_source = true

; Tiempo de bloqueo (segundos)
block_duration_seconds = 120

; Log detallado para debugging de anomalías
log_anomaly_details = true



; ================================================================
; ===================  LOGGING GENERAL  ==========================
; ================================================================

[security_logging]
; Nivel de log para eventos de seguridad: DEBUG | INFO | WARNING | ERROR
log_level = INFO

; Log separado de seguridad
log_file = operador/aprendizaje/logs/security_guard.log

; Limitar volumen de logs de seguridad
max_logs_per_sec = 50

; Colapsar mensajes repetidos
enable_log_dedup = true
dedup_window_sec = 30
