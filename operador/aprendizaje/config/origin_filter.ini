; ================================
; ORIGIN FILTER CONFIG
; Evita retroalimentación de mensajes internos.
; ================================

[general]
enabled = true
log_level = INFO
log_file = operador/aprendizaje/logs/origin_filter.log

; Si true, descarta silenciosamente sin lanzar excepciones
silent_drop = true

[whitelist]
; Orígenes explícitamente permitidos (si se define, solo estos pasan).
; Dejar vacío para permitir todos excepto blacklist.
allowed_origins = ui,api_externa,webhook

[blacklist]
; Orígenes explícitamente bloqueados
blocked_origins = test_spam,fuzzer

[rules]
; Evita que un mensaje vuelva al módulo que lo originó
block_return_to_sender = true

; Si true, copia mínima de log para auditoría interna
log_dropped_messages = true

; Campos usados para identificar origen y destino
origin_field_name = origen
destination_field_name = destino
