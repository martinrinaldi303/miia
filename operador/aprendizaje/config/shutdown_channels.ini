; ================================================================
; CHANNEL REGISTRY – DEFINICIÓN DE CANALES Y DESTINOS MIIA
; Versión reforzada para producción
; ================================================================


; ================================================================
; =========================  CHANNELS  ===========================
; ================================================================

[channels]
clean_on_exit = true

; Lista de canales permitidos para salida del sistema
list = class1_output,class2_output,class3_output,class4_output,class5_output,\
       class6_output,class7_output,class8_output,class9_output,class10_output,\
       class21_output,class22_output,class23_output,class24_output,\
       class25_output,class27_output,class28_output,class29_output,\
       miia.semantic.analysis,class25_equivalence_assert,\
       motor_lenguaje_state,motor_emocional_state,modulo_de_control,\
       miia_interfaz_eventos

; Activar validación estricta
strict_validation = true

; Evitar duplicación de nombres
prevent_duplicate_channels = true

; Registrar canales que están sin uso
log_unused_channels = true

; Prefijo obligatorio para canales internos
required_internal_prefix = miia.

; Bloquear canales que incluyan palabras peligrosas
blocked_keyword_patterns = debug,raw,unsafe,temp

; Evitar que un módulo cree canales dinámicos no declarados
block_dynamic_channel_creation = true

; Forzar sanitización de nombres
sanitize_channel_names = true

; Validar formato del nombre de canal (letras, números, guiones)
channel_name_regex = ^[a-zA-Z0-9._-]+$

; Log de violaciones
log_channel_violations = true



; ================================================================
; ========================  DESTINATIONS  =========================
; ================================================================

[destinations]
clean_on_exit = true

list = class25_ingest,class25_output,class25_output_texto,ui_stream,\
       class7_input,class17_input,class14_input,\
       class6_input,class9_input,class13_input,\
       class21_input,class22_input,class23_input,\
       class24_input,class27_input,class28_input

; Validación estricta de destinos
strict_validation = true

; Prevent duplication
prevent_duplicate_destinations = true

; Evitar rutas inseguras
required_destination_prefix = class
block_if_prefix_mismatch = true

; Detectar destinos obsoletos (no usados por módulos activos)
track_obsolete_destinations = true

; Permitir únicamente escritura en destinos seguros
allow_only_whitelisted = true

; Prohibir destinos relativos o con patrones extraños
destination_name_regex = ^[a-zA-Z0-9._-]+$

; Log de violaciones
log_destination_violations = true



; ================================================================
; =====================  CROSS-VALIDATION  =======================
; ================================================================

[cross_validation]

; Verifica que cada canal tenga un destino permitido
ensure_channel_destination_coherence = true

; Evitar rutas circulares (loop de canal → destino → canal)
avoid_channel_loops = true

; Registrar inconsistencias
log_inconsistencies = true



; ================================================================
; =======================  CLEANUP CONTROL  ======================
; ================================================================

[cleanup]
; Si true, se eliminan canales/destinos no válidos al iniciar
auto_cleanup_invalid_entries = true

; Si true, se eliminan canales/destinos no usados por más de X días
cleanup_unused_entries = true
cleanup_unused_after_days = 14

; Log del proceso de limpieza
log_cleanup_events = true
