; ================================================================
; CLASS19 FLOW CONTROL
; Control de entrada de motores hacia class19 (memoria contextual).
; ================================================================

[engines]
; Lista de motores permitidos para enviar datos a class19
; Formato reforzado: separados por coma, sin espacios
enabled_engines = 3,10,14,18,35,40,41

; Si true, descarta silenciosamente motores no autorizados
reject_unauthorized = true

; Registrar intentos de motores no autorizados
log_unauthorized_attempts = true

; Impedir reenvío circular entre motores
prevent_circular_loops = true

; Cantidad máxima de mensajes por motor por minuto
max_messages_per_motor_per_min = 120



; ================================================================
; RATE LIMIT GLOBAL
; ================================================================

[rate_limit]
; Máxima cantidad de mensajes permitidos sumados de todos los motores
max_messages_per_minute = 500

; Activar modo de enfriamiento automático al saturar
cooldown_enabled = true

; Duración del cooldown (milisegundos)
cooldown_ms = 800

; Política al saturar:
; drop = descartar silenciosamente
; queue = encolar hasta límite
; block = bloquear motor temporalmente
on_overload = queue

; Tamaño máximo de la cola
max_queue_size = 2000

; Si la cola se llena: drop_oldest | drop_new | flush
queue_overflow_policy = drop_oldest



; ================================================================
; VALIDACIONES DE FLUJO
; ================================================================

[validation]
; Rechazar mensajes sin los metadatos mínimos
require_timestamp = true
require_engine_id = true

; Límite de tamaño del mensaje (KB)
max_message_size_kb = 200

; Evitar que lleguen mensajes duplicados
enable_deduplication = true
dedupe_window_seconds = 20

; Evitar mensajes demasiado rápidos del mismo motor
min_message_interval_ms = 30



; ================================================================
; LOGGING
; ================================================================

[logging]
log_level = INFO
log_file = operador/aprendizaje/logs/class19_flow.log

; Registrar eventos críticos de saturación
log_overload_events = true

; Registrar mensajes descartados
log_dropped_messages = false

; Registrar colas llenas
log_queue_full = true



; ================================================================
; SEGURIDAD EXTRA
; ================================================================

[safety]
; Si un motor envía datos corruptos repetidamente, bloquearlo
auto_block_corrupted_engines = true

; Intentos máximos antes de bloquear
max_corrupted_attempts = 5

; Lista de motores permanentemente bloqueados
blocked_engines = 
; === EVITAR QUE CLASS27 SOBRECARGUE EL BUS ===
class27_output.max_msgs_per_sec = 2
class27_output.priority = low      ; baja prioridad para que no compita con decisiones reales