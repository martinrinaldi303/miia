; ================================
; FRESHNESS GUARD CONFIG
; Solo acepta datos nuevos o más recientes.
; ================================

[general]
enabled = true
log_level = INFO
log_file = operador/aprendizaje/logs/freshness_guard.log

[timestamps]
; Campo de timestamp en los JSON
timestamp_field_name = timestamp

; Formato esperado (para parseo en Python): iso8601 | epoch | custom
timestamp_format = iso8601

; Si custom, especificar pattern de strptime (ejemplo)
custom_pattern = %Y-%m-%dT%H:%M:%S

; Desfase máximo aceptable en segundos (para tolerar reloj desajustado)
max_clock_skew_seconds = 120

[rules]
; Si true, rechaza datos con timestamp < último procesado para esa llave
reject_older_than_last_seen = true

; Si true, mantiene un índice por (origen, tipo_dato)
track_per_origin = true

; Tiempo máximo a considerar “viejo” (en segundos) desde ahora
min_acceptable_age_seconds = -1
; -1 = sin límite absoluto, solo se usa la regla de last_seen.
