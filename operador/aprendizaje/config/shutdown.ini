; ================================================================
; SHUTDOWN MANAGER – APAGADO SEGURO DEL SISTEMA MIIA
; ================================================================

[shutdown]
kill_redis = true
kill_child_processes = true
kill_dotnet = true
kill_python = true

; Tiempo de gracia antes de forzar terminación
grace_period_ms = 1500

; ================================================================
; ------------------- CONTROLES DE SEGURIDAD ---------------------
; ================================================================

; Evita doble apagado simultáneo
prevent_double_shutdown = true

; Asegura que el núcleo confirme el inicio del proceso
require_shutdown_ack = true

; Registrar todos los pasos del apagado
log_shutdown_sequence = true

; Matar procesos colgados una vez terminado el período de gracia
force_kill_after_grace = true

; Reintentar apagado si falla el primer intento
retry_on_failure = true
retry_delay_ms = 300
max_retries = 3

; Proteger procesos marcados como "críticos"
protect_critical_processes = true
critical_process_list = systemd,init

; ================================================================
; ------------------- MANEJO DE PROCESOS -------------------------
; ================================================================

; Forzar detención de subprocesos que no respondan
kill_unresponsive_children = true
child_timeout_ms = 1000

; Evitar que procesos vuelvan a iniciarse automáticamente durante shutdown
freeze_restart_manager = true

; Limpieza de recursos (sockets, pipes, file locks)
cleanup_resources = true

; ================================================================
; ------------------- REDIS SHUTDOWN CONTROL ---------------------
; ================================================================

[shutdown.redis]
flush_before_kill = true
backup_on_exit = true
require_safe_close = false
kill_timeout_ms = 1200

; Evita pérdida de datos críticos
persist_memory_to_disk = true

; ================================================================
; ------------------- LOGS Y DIAGNÓSTICOS ------------------------
; ================================================================

[shutdown.logging]
log_file = operador/aprendizaje/logs/shutdown_manager.log
log_level = INFO

; Registrar procesos lentos o colgados
log_hung_processes = true

; Registrar estado de CPU y memoria al apagar
log_system_state_on_shutdown = true
