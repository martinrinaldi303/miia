# /etc/systemd/system/ollama.service.d/10-prewarm.conf
# Precarga gemma2:2b apenas arranca Ollama, así la primera charla después de un
# reinicio (de Ollama o de la VPS) no paga la carga en frío (~8-12 s).
# num_ctx tiene que ser el MISMO que usa MIIA (MIIA_LLM_CTX, 2048): si no coincide,
# Ollama descarga el modelo y lo vuelve a cargar en la primera charla.
#
# Instalar:  cp 10-prewarm.conf /etc/systemd/system/ollama.service.d/
#            systemctl daemon-reload && systemctl restart ollama
[Service]
ExecStartPost=/bin/bash -c 'for i in $(seq 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done; curl -s http://127.0.0.1:11434/api/generate -d "{\"model\":\"gemma2:2b\",\"keep_alive\":-1,\"options\":{\"num_ctx\":2048}}" >/dev/null || true'
